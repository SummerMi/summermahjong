# riichi demo 的 Nginx 反向代理示例（放在 /etc/nginx/conf.d/riichi.conf）。
#
# 要点：
#   - WebSocket 必须升级头（Upgrade/Connection）；
#   - 建局接口有限流（公网 demo 防止被灌满房间）；
#   - /metrics 只对内网开放，不暴露公网。
limit_req_zone $binary_remote_addr zone=riichi_create:10m rate=5r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name mahjong.example.com;

    location /api/v1/ws/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/v1/games {
        limit_req zone=riichi_create burst=2 nodelay;
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /metrics {
        # 指标只给本机/内网抓取；公网不暴露。
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://127.0.0.1:8099;
    }

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
