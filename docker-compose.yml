# 本地一键起服务：docker compose up --build
# 打开 http://127.0.0.1:8000/ 或 http://127.0.0.1:8000/docs
#
# 镜像已同时安装 [mysql] / [redis] 两个可选 extra，所以容器里可以直接用
# MySQL / Redis 分支，只要把下面注释掉的环境变量打开即可。
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gd-mahjong-api:latest
    container_name: gd-mahjong-api
    ports:
      - "8000:8000"
    environment:
      # 全部可用环境变量覆盖，见 app/core/config.py 与 .env.example
      APP_NAME: "广东麻将（推倒胡）后端服务"
      VERSION: "0.1.0"
      CORS_ORIGINS: "*"
      MAX_GAMES: "100"
      GAME_TTL_SECONDS: "7200"
      # ── 按需打开（三个都留空 = 纯内存模式，零依赖）──
      # Redis 当存储（容器内用服务名 redis，不是 127.0.0.1）
      # REDIS_URL: "redis://redis:6379/0"
      # 关系库（SQLite 或 MySQL）
      # DATABASE_URL: "mysql+aiomysql://root:change-me@mysql:3306/mahjong"
      # Redis 当缓存（cache-aside，建议与存储用不同 db 编号）
      # CACHE_REDIS_URL: "redis://redis:6379/1"
      # CACHE_TTL_SECONDS: "30"
      # JWT 鉴权（留空 = 关闭；非空则对 /api/v1/games* 启用 Bearer + 座位绑定）
      # JWT_SECRET: "please-change-me"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Redis：既可以对局存储（REDIS_URL），也可以做读缓存（CACHE_REDIS_URL）。
  # 本地真跑：docker compose up -d redis，再按上面的注释打开对应环境变量。
  redis:
    image: redis:7-alpine
    container_name: gd-mahjong-redis
    ports:
      - "6379:6379"
    # appendonly yes：开启 AOF，容器重启后对局仍在（Redis 仓库重启可查的前提）
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  redis-data:
