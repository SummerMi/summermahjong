# 单机 demo：server + Redis（事件存储 + 跨实例广播）。
# 用法（仓库根目录）：
#   export RIICHI_JWT_SECRET=$(openssl rand -hex 32)
#   docker compose -f riichi/deploy/docker-compose.yml up -d --build
#   # 打开 http://127.0.0.1:8099/healthz
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - riichi-redis:/data
    restart: unless-stopped

  riichi:
    build:
      context: ../..
      dockerfile: riichi/deploy/Dockerfile
    environment:
      RIICHI_JWT_SECRET: ${RIICHI_JWT_SECRET:?set RIICHI_JWT_SECRET first}
      RIICHI_REDIS_URL: redis://redis:6379/0
    ports:
      - "8099:8080"
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  riichi-redis:
