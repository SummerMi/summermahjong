name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-test:
    name: ruff + pytest (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖（含 dev 工具）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 代码风格检查（ruff）
        run: python -m ruff check app tests

      - name: 单元测试（pytest）
        run: python -m pytest
