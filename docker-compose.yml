# 本地一键起服务：docker compose up --build
# 打开 http://127.0.0.1:8000/ 或 http://127.0.0.1:8000/docs
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gd-mahjong-api:latest
    container_name: gd-mahjong-api
    ports:
      - "8000:8000"
    environment:
      # 全部可用环境变量覆盖，见 app/core/config.py
      APP_NAME: "广东麻将（推倒胡）后端服务"
      VERSION: "0.1.0"
      CORS_ORIGINS: "*"
      MAX_GAMES: "100"
      GAME_TTL_SECONDS: "7200"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Redis 对局仓库（可选分支）：本地想真跑 Redis 时 `docker compose up redis`，
  # 再用 REDIS_URL=redis://127.0.0.1:6379/0 启动 API，lifespan 会自动切到 RedisGameRepository。
  # 注意：api 服务默认仍是内存模式（零依赖），没有把 REDIS_URL 加进 api 的环境变量，
  # 因为镜像按 pyproject 主依赖构建、未安装可选的 redis 包（见 docs/adr-0003）。
  redis:
    image: redis:7-alpine
    container_name: gd-mahjong-redis
    ports:
      - "6379:6379"
    # appendonly yes：开启 AOF，容器重启后对局仍在（Redis 仓库重启可查的前提）
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  redis-data:
